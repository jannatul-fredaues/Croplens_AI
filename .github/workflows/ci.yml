name: CI

on:
  push:
  workflow_dispatch:

# Cancel an older run of the same branch when a newer push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint # fail fast on style before the heavy TensorFlow install
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt pytest httpx

      - name: Run tests
        # pytest exits with code 5 when it finds no tests. That is allowed for
        # now so CI stays green during Days 1-3. Once tests exist (Day 4),
        # replace this whole step with a plain `pytest`.
        run: |
          set +e
          pytest
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet - skipping"
            exit 0
          fi
          exit $code

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        # Build context is the repo root so the image can include models/.
        # Skipped while api/Dockerfile is still empty (before Day 6).
        run: |
          if [ -s api/Dockerfile ]; then
            docker build -f api/Dockerfile -t croplens-api .
          else
            echo "api/Dockerfile is empty - skipping"
          fi
